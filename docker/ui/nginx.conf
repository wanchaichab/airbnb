# Map to conditionally set Connection header for WebSocket upgrades
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React app — handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy JSON API HTTP + WebSocket requests to the DAML ledger container
    location /v1/ {
        proxy_pass         http://daml-ledger:7575/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket support (used by useStreamQueries for /v1/stream/*)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # Increase timeouts for long-lived WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
